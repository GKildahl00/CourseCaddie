<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

    <title>CourseCaddie</title>

    <link
        rel="manifest"
        href="./manifest.webmanifest"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/apple-touch-icon.png"
    >

    <meta
        name="theme-color"
        content="#f4f4f4"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /*
            Opdateres også fra JavaScript med den faktisk synlige
            Safari-højde. 100dvh fungerer som fallback i moderne browsere.
            */
            --app-height: 100dvh;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 12px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /*
        GPS-skærmen fylder præcis den synlige browserhøjde.
        Den indre baneoversigt får resten af pladsen og skaleres.
        */
        #courseScreen.active {
            display: flex;
            flex-direction: column;
            height: calc(var(--app-height, 100dvh) - 24px);
            min-height: 0;
            overflow: hidden;
            padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
        }

        /* ------------------------------------------------
           HOVEDMENU
           ------------------------------------------------ */

        .main-menu {
            padding-top: 35px;
        }

        .main-menu h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .main-menu-subtitle {
            font-size: 17px;
            color: #666;
            margin-bottom: 35px;
        }

        .course-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .course-button {
            width: 100%;
            padding: 22px 18px;
            border: none;
            border-radius: 14px;
            background-color: white;
            text-align: left;
            cursor: pointer;
        }

        .course-button:active {
            transform: scale(0.98);
        }

        .course-name {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-bottom: 6px;
        }

        .course-info {
            display: block;
            font-size: 14px;
            color: #666;
        }

        /* ------------------------------------------------
           HEADER / HJEM
           ------------------------------------------------ */

        .screen-header {
            position: relative;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .screen-header h1 {
            font-size: clamp(21px, 6.6vw, 26px);
            margin-top: clamp(4px, 1.2vh, 12px);
            margin-bottom: clamp(2px, 0.8vh, 8px);
            padding-left: 50px;
            padding-right: 50px;
            line-height: 1.08;
        }

        .home-button {
            position: absolute;
            top: 0;
            left: 0;
            width: 58px;
            height: 58px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            color: #007710;
        }

        .home-button svg {
            width: 48px;
            height: 48px;
            display: block;
            fill: currentColor;
        }

        .home-button:active {
            background-color: #e5e5e5;
        }

        /* ------------------------------------------------
           HUL-NAVIGATION
           ------------------------------------------------ */

        .hole-navigation {
            position: relative;
            display: grid;
            min-height: 36px;
            align-items: center;
            margin-bottom: clamp(10px, 2.4vh, 28px);
            flex: 0 0 auto;
        }

        .hole {
            font-size: clamp(22px, 6.2vw, 24px);
            position: relative;
            top: 2px;
        }

        .hole-nav-button {
            position: absolute;
            top: 60%;
            width: 100px;
            height: 100px;
            padding: 0;
            border: none;
            background: transparent;
            color: #007710;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            transform: translateY(-50%);
        }

        #prevHoleButton {
            left: 64px;
        }

        #nextHoleButton {
            right: 64px;
        }

        .hole-nav-button:disabled {
            visibility: hidden;
        }

        .hole-nav-button:active {
            opacity: 0.5;
        }

        /* ------------------------------------------------
           GPS
           ------------------------------------------------ */

        #startButton {
            width: 100%;
            padding: clamp(10px, 1.7vh, 14px);
            margin-top: 2px;
            flex: 0 0 auto;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #e9e9e9;
            color: #007aff;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #startButton.gps-active {
            background-color: #d93636;
            color: white;
        }

        #startButton:active {
            opacity: 0.8;
        }

        #status {
            margin-top: clamp(4px, 0.9vh, 8px);
            font-size: 15px;
            flex: 0 0 auto;
            color: #555;
        }

        #accuracy {
            margin-top: 2px;
            margin-bottom: clamp(5px, 1vh, 12px);
            font-size: 13px;
            flex: 0 0 auto;
            color: #777;
        }

        /* ------------------------------------------------
           AFSTANDE + BANEOVERSIGT
           ------------------------------------------------ */

        .hole-layout {
            display: grid;
            grid-template-columns: clamp(105px, 31vw, 120px) minmax(0, 1fr);
            gap: clamp(8px, 2.5vw, 10px);
            width: 100%;
            margin-top: clamp(3px, 0.8vh, 10px);
            align-items: stretch;

            /* Fylder resten af den synlige skærm */
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .distance-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(6px, 1.2vh, 10px);
            height: 100%;
            min-height: 0;
        }

        .distance-box {
            background-color: white;
            padding: clamp(6px, 1.4vh, 12px) 4px;
            border-radius: 12px;

            /* De tre bokse deler højden ligeligt */
            flex: 1 1 0;
            min-height: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .label {
            font-size: clamp(11px, 3.3vw, 13px);
            color: #555;
            margin-bottom: clamp(3px, 0.8vh, 8px);
        }

        .distance {
            font-size: clamp(26px, 8.2vw, 32px);
            font-weight: bold;
            line-height: 1;
            margin: 0;
        }

        .unit {
            font-size: clamp(10px, 3vw, 12px);
            margin-top: clamp(3px, 0.6vh, 6px);
            color: #555;
        }

        .hole-map-container {
            width: 100%;
            height: 100%;
            margin: 0;
            min-width: 0;
            min-height: 0;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            background-color: white;
            border-radius: 12px;
            overflow: hidden;

        }

        .hole-map {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;

            display: block;
            margin: 0;

            /*
            Billedet skaleres både efter bredde og højde,
            men bliver aldrig forvrænget.
            */
            object-fit: contain;
            object-position: center top;
        }

        /*
        ------------------------------------------------
        BANEOVERSIGT - FULDSKÆRMSVISNING
        ------------------------------------------------
        */

        .hole-map {
            cursor: zoom-in;
        }


        /*
        Selve full-screen billedviseren
        */
        .image-viewer {
            position: fixed;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            z-index: 9999;

            display: none;

            background-color: #f4f4f4;

            overflow: hidden;

            touch-action: none;

            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }


        /*
        Når billedviseren er åben
        */
        .image-viewer.open {
            display: block;
        }


        /*
        Området hvor billedet kan zoomes
        */
        .image-viewer-stage {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            touch-action: none;
        }


        /*
        Det store baneoversigtsbillede
        */
        .image-viewer-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            transform-origin: center center;

            user-select: none;

            -webkit-user-drag: none;

            touch-action: none;

            will-change: transform;
        }


        /*
        Luk-knappen
        */
        .image-viewer-close {
            position: absolute;

            top: calc(12px + env(safe-area-inset-top));
            right: 12px;

            z-index: 10000;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background-color: rgba(255, 255, 255, 0.9);

            color: #222;

            font-size: 32px;
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }

            #courseScreen.active {
                height: calc(var(--app-height, 100dvh) - 16px);
            }

            .hole-layout {
                grid-template-columns: 100px minmax(0, 1fr);
                gap: 8px;
            }

            .distance {
                font-size: 28px;
            }

            .label {
                font-size: 12px;
            }

            .unit {
                font-size: 11px;
            }

            .screen-header h1 {
                font-size: 21px;
            }

            .hole {
                font-size: 22px;
            }

            .main-menu h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

        ================================================================
        SYNLIG SAFARI-HØJDE
        ================================================================

        Safari på iPhone ændrer den synlige højde, når adresse- og
        værktøjslinjen vises/skjules. visualViewport giver os den
        aktuelle højde, så layoutet altid kan tilpasse sig.
        */

        function updateVisibleHeight(forceUpdate = false) {

            const viewport = window.visualViewport;

            /*
            Hvis brugeren pinch-zoomer, må layoutet IKKE
            beregne sin størrelse igen.
            */
            if (
                viewport &&
                !forceUpdate &&
                Math.abs(viewport.scale - 1) > 0.01
            ) {
                return;
            }

            const visibleHeight =
                viewport
                    ? viewport.height
                    : window.innerHeight;

            document.documentElement.style.setProperty(
                "--app-height",
                visibleHeight + "px"
            );
        }


        /*
        Første indlæsning
        */
        updateVisibleHeight(true);


        /*
        Normal ændring af vinduets størrelse
        */
        window.addEventListener(
            "resize",
            function () {
                updateVisibleHeight(false);
            }
        );


        /*
        Telefonen drejes
        */
        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    function () {
                        updateVisibleHeight(true);
                    },
                    150
                );

            }
        );


        /*
        Safari viser/skjuler sine bjælker.
        Men pinch-zoom ignoreres.
        */
        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                function () {
                    updateVisibleHeight(false);
                }
            );

        }

                },
                {
                    number: 15,
                    image: "images/Lyngbygaard_18_hulsbanen_hul_15.png",
                    front: { lat: 56.17602222, lon: 10.03667500 },
                    center: { lat: 56.17611111, lon: 10.03648333 },
                    back: { lat: 56.17609167, lon: 10.03629722 }
                },
                {
                    number: 16,
                    image: "images/Lyngbygaard_18_hulsbanen_hul_16.png",
                    front: { lat: 56.17762222, lon: 10.03086389 },
                    center: { lat: 56.17769167, lon: 10.03072222 },
                    back: { lat: 56.17769167, lon: 10.03049444 }
                },
                {
                    number: 17,
                    image: "images/Lyngbygaard_18_hulsbanen_hul_17.png",
                    front: { lat: 56.17696389, lon: 10.03082222 },
                    center: { lat: 56.17683889, lon: 10.03093611 },
                    back: { lat: 56.17671111, lon: 10.03097222 }
                },
                {
                    number: 18,
                    image: "images/Lyngbygaard_18_hulsbanen_hul_18.png",
                    front: { lat: 56.17127778, lon: 10.03040556 },
                    center: { lat: 56.17105278, lon: 10.03046389 },
                    back: { lat: 56.17084722, lon: 10.03030000 }
                }
                ]
            }
        };

        /*
        ================================================================
        APP STATE
        ================================================================
        */

        let currentCourseKey = null;
        let currentHoleIndex = 0;
        let watchId = null;
        let latestPosition = null;

        function getCurrentCourse() {
            return courses[currentCourseKey];
        }

        function getCurrentHole() {
            return getCurrentCourse().holes[currentHoleIndex];
        }

        /*
        ================================================================
        SKÆRM-NAVIGATION
        ================================================================
        */

        function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(function (screen) {
                screen.classList.remove("active");
            });

            document.getElementById(screenId).classList.add("active");
            window.scrollTo(0, 0);
        }

        function openCourse(courseKey) {
            stopGPS("GPS er ikke startet");

            currentCourseKey = courseKey;
            currentHoleIndex = 0;

            updateCourseDisplay();
            updateHoleDisplay();

            showScreen("courseScreen");
        }

        function goHome() {
            stopGPS("GPS er ikke startet");
            currentCourseKey = null;
            currentHoleIndex = 0;
            showScreen("mainMenuScreen");
        }

        /*
        ================================================================
        AFSTANDSBEREGNING
        ================================================================
        */

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const earthRadius = 6371000;

            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const deltaLat = (lat2 - lat1) * Math.PI / 180;
            const deltaLon = (lon2 - lon1) * Math.PI / 180;

            const a =
                Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(deltaLon / 2) * Math.sin(deltaLon / 2);

            const c =
                2 * Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );

            return earthRadius * c;
        }

        function updateDistances(position) {
            if (currentCourseKey === null) {
                return;
            }

            const currentHole = getCurrentHole();

            const myLatitude = position.coords.latitude;
            const myLongitude = position.coords.longitude;

            const distanceFront = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.front.lat,
                currentHole.front.lon
            );

            const distanceCenter = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.center.lat,
                currentHole.center.lon
            );

            const distanceBack = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.back.lat,
                currentHole.back.lon
            );

            document.getElementById("frontDistance").textContent =
                Math.round(distanceFront);

            document.getElementById("centerDistance").textContent =
                Math.round(distanceCenter);

            document.getElementById("backDistance").textContent =
                Math.round(distanceBack);
        }

        /*
        ================================================================
        GPS
        ================================================================
        */

        function positionUpdated(position) {
            latestPosition = position;

            console.log(
                "Min position:",
                position.coords.latitude,
                position.coords.longitude
            );

            updateDistances(position);

            document.getElementById("status").textContent =
                "GPS aktiv";

            document.getElementById("accuracy").textContent =
                "Estimeret GPS-nøjagtighed: ±" +
                Math.round(position.coords.accuracy) +
                " meter";
        }

        function positionError(error) {
            document.getElementById("status").textContent =
                "GPS fejl: " + error.message;
        }

        function startGPS() {
            if (!navigator.geolocation) {
                document.getElementById("status").textContent =
                    "Denne browser understøtter ikke GPS.";
                return;
            }

            if (watchId !== null) {
                return;
            }

            document.getElementById("status").textContent =
                "Finder GPS-position...";

            watchId = navigator.geolocation.watchPosition(
                positionUpdated,
                positionError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );

            const button = document.getElementById("startButton");

            button.textContent = "Stop GPS";
            button.classList.add("gps-active");
            button.setAttribute("aria-pressed", "true");
        }

        function stopGPS(statusText = "GPS stoppet") {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            latestPosition = null;

            const button = document.getElementById("startButton");

            button.textContent = "Start GPS";
            button.classList.remove("gps-active");
            button.setAttribute("aria-pressed", "false");

            document.getElementById("status").textContent = statusText;
            document.getElementById("accuracy").textContent = "";

            resetDistances();
        }

        function resetDistances() {
            document.getElementById("frontDistance").textContent = "---";
            document.getElementById("centerDistance").textContent = "---";
            document.getElementById("backDistance").textContent = "---";
        }

        /*
        ================================================================
        VISNING AF BANE / HUL
        ================================================================
        */

        function updateCourseDisplay() {
            const currentCourse = getCurrentCourse();

            document.getElementById("courseTitle").textContent =
                currentCourse.name;
        }

        function updateHoleDisplay() {
            if (currentCourseKey === null) {
                return;
            }

            const currentCourse = getCurrentCourse();
            const currentHole = getCurrentHole();

            document.getElementById("holeTitle").textContent =
                "Hul " + currentHole.number;

            const holeMap = document.getElementById("holeMap");

            holeMap.src = currentHole.image;
            holeMap.alt =
                "Baneoversigt hul " +
                currentHole.number +
                " - " +
                currentCourse.name;

            document.getElementById("prevHoleButton").disabled =
                currentHoleIndex === 0;

            document.getElementById("nextHoleButton").disabled =
                currentHoleIndex === currentCourse.holes.length - 1;

            if (latestPosition !== null) {
                updateDistances(latestPosition);
            } else {
                resetDistances();
            }
        }

                /*
        ================================================================
        BANEOVERSIGT - FULDSKÆRMS ZOOM
        ================================================================
        */

        const imageViewer =
            document.getElementById(
                "imageViewer"
            );


        const imageViewerStage =
            document.getElementById(
                "imageViewerStage"
            );


        const imageViewerImage =
            document.getElementById(
                "imageViewerImage"
            );


        const imageViewerClose =
            document.getElementById(
                "imageViewerClose"
            );


        const holeMap =
            document.getElementById(
                "holeMap"
            );


        /*
        Zoom-indstillinger
        */

        let viewerScale = 1;

        let viewerTranslateX = 0;
        let viewerTranslateY = 0;

        const viewerMinScale = 1;
        const viewerMaxScale = 5;


        /*
        Aktive fingre / pointere
        */

        const activePointers =
            new Map();


        let previousPinchDistance = null;

        let previousPanX = null;
        let previousPanY = null;


        /*
        ------------------------------------------------
        OPDATER BILLEDETS POSITION
        ------------------------------------------------
        */

        function updateViewerTransform() {

            imageViewerImage.style.transform =
                "translate(" +
                viewerTranslateX +
                "px, " +
                viewerTranslateY +
                "px) scale(" +
                viewerScale +
                ")";
        }


        /*
        ------------------------------------------------
        NULSTIL ZOOM
        ------------------------------------------------
        */

        function resetImageViewer() {

            viewerScale = 1;

            viewerTranslateX = 0;
            viewerTranslateY = 0;

            previousPinchDistance = null;

            previousPanX = null;
            previousPanY = null;

            activePointers.clear();

            updateViewerTransform();
        }


        /*
        ------------------------------------------------
        ÅBN BANEOVERSIGT
        ------------------------------------------------
        */

        function openImageViewer() {

            /*
            Brug præcis det billede som vises
            på det aktuelle hul.
            */

            imageViewerImage.src =
                holeMap.src;


            imageViewerImage.alt =
                holeMap.alt;


            resetImageViewer();


            imageViewer.classList.add(
                "open"
            );


            imageViewer.setAttribute(
                "aria-hidden",
                "false"
            );
        }


        /*
        ------------------------------------------------
        LUK BANEOVERSIGT
        ------------------------------------------------
        */

        function closeImageViewer() {

            imageViewer.classList.remove(
                "open"
            );


            imageViewer.setAttribute(
                "aria-hidden",
                "true"
            );


            resetImageViewer();
        }


        /*
        ------------------------------------------------
        AFSTAND MELLEM TO FINGRE
        ------------------------------------------------
        */

        function getPointerDistance(
            pointer1,
            pointer2
        ) {

            const deltaX =
                pointer2.x -
                pointer1.x;


            const deltaY =
                pointer2.y -
                pointer1.y;


            return Math.hypot(
                deltaX,
                deltaY
            );
        }


        /*
        ------------------------------------------------
        FINGER NED
        ------------------------------------------------
        */

        imageViewerStage.addEventListener(
            "pointerdown",
            function (event) {

                imageViewerStage.setPointerCapture(
                    event.pointerId
                );


                activePointers.set(
                    event.pointerId,
                    {
                        x: event.clientX,
                        y: event.clientY
                    }
                );


                /*
                Én finger:
                start panorering.
                */

                if (
                    activePointers.size === 1
                ) {

                    previousPanX =
                        event.clientX;

                    previousPanY =
                        event.clientY;
                }


                /*
                To fingre:
                start pinch.
                */

                if (
                    activePointers.size === 2
                ) {

                    const pointers =
                        Array.from(
                            activePointers.values()
                        );


                    previousPinchDistance =
                        getPointerDistance(
                            pointers[0],
                            pointers[1]
                        );
                }
            }
        );


        /*
        ------------------------------------------------
        FINGER BEVÆGES
        ------------------------------------------------
        */

        imageViewerStage.addEventListener(
            "pointermove",
            function (event) {

                if (
                    !activePointers.has(
                        event.pointerId
                    )
                ) {

                    return;
                }


                activePointers.set(
                    event.pointerId,
                    {
                        x: event.clientX,
                        y: event.clientY
                    }
                );


                /*
                TO FINGRE:
                PINCH ZOOM
                */

                if (
                    activePointers.size === 2
                ) {

                    const pointers =
                        Array.from(
                            activePointers.values()
                        );


                    const currentDistance =
                        getPointerDistance(
                            pointers[0],
                            pointers[1]
                        );


                    if (
                        previousPinchDistance !== null
                    ) {

                        const scaleChange =
                            currentDistance /
                            previousPinchDistance;


                        viewerScale *=
                            scaleChange;


                        viewerScale =
                            Math.min(
                                viewerMaxScale,
                                Math.max(
                                    viewerMinScale,
                                    viewerScale
                                )
                            );


                        /*
                        Hvis vi zoomer helt ud,
                        centreres billedet igen.
                        */

                        if (
                            viewerScale ===
                            viewerMinScale
                        ) {

                            viewerTranslateX = 0;
                            viewerTranslateY = 0;
                        }


                        updateViewerTransform();
                    }


                    previousPinchDistance =
                        currentDistance;


                    return;
                }


                /*
                ÉN FINGER:
                PANORÉR HVIS DER ER ZOOMET IND
                */

                if (
                    activePointers.size === 1 &&
                    viewerScale > 1
                ) {

                    if (
                        previousPanX !== null &&
                        previousPanY !== null
                    ) {

                        const deltaX =
                            event.clientX -
                            previousPanX;


                        const deltaY =
                            event.clientY -
                            previousPanY;


                        viewerTranslateX +=
                            deltaX;


                        viewerTranslateY +=
                            deltaY;


                        updateViewerTransform();
                    }


                    previousPanX =
                        event.clientX;


                    previousPanY =
                        event.clientY;
                }
            }
        );


        /*
        ------------------------------------------------
        FINGER SLIPPES
        ------------------------------------------------
        */

        function removeViewerPointer(
            event
        ) {

            activePointers.delete(
                event.pointerId
            );


            previousPinchDistance =
                null;


            /*
            Hvis én finger stadig er på
            skærmen efter pinch, bruger vi
            den som startpunkt for panorering.
            */

            if (
                activePointers.size === 1
            ) {

                const remainingPointer =
                    Array.from(
                        activePointers.values()
                    )[0];


                previousPanX =
                    remainingPointer.x;


                previousPanY =
                    remainingPointer.y;

            } else {

                previousPanX =
                    null;

                previousPanY =
                    null;
            }
        }


        imageViewerStage.addEventListener(
            "pointerup",
            removeViewerPointer
        );


        imageViewerStage.addEventListener(
            "pointercancel",
            removeViewerPointer
        );


        /*
        ------------------------------------------------
        ÅBN / LUK
        ------------------------------------------------
        */

        holeMap.addEventListener(
            "click",
            openImageViewer
        );


        imageViewerClose.addEventListener(
            "click",
            closeImageViewer
        );


        /*
        Escape på computer
        */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    imageViewer.classList.contains(
                        "open"
                    )
                ) {

                    closeImageViewer();
                }
            }
        );

                /*
                ================================================================
        EVENT LISTENERS
        ================================================================
        */

        document.getElementById("segaCourseButton").addEventListener(
            "click",
            function () {
                openCourse("sega");
            }
        );

        document.getElementById("mainCourseButton").addEventListener(
            "click",
            function () {
                openCourse("main18");
            }
        );

        document.getElementById("homeButton").addEventListener(
            "click",
            goHome
        );

        document.getElementById("startButton").addEventListener(
            "click",
            function () {
                if (watchId === null) {
                    startGPS();
                } else {
                    stopGPS();
                }
            }
        );

        document.getElementById("prevHoleButton").addEventListener(
            "click",
            function () {
                if (currentHoleIndex > 0) {
                    currentHoleIndex--;
                    updateHoleDisplay();
                }
            }
        );

        document.getElementById("nextHoleButton").addEventListener(
            "click",
            function () {
                const currentCourse = getCurrentCourse();

                if (currentHoleIndex < currentCourse.holes.length - 1) {
                    currentHoleIndex++;
                    updateHoleDisplay();
                }
            }
        );

        /*
        ================================================================
        INITIALISERING
        ================================================================
        */

        showScreen("mainMenuScreen");
    </script>
