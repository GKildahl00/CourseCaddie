<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">

    <!-- Sørger for at siden ser rigtig ud på en iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lyngbygaard Golf GPS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .hole {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .distance-box {
            background-color: white;
            margin: 12px 0;
            padding: 20px;
            border-radius: 12px;
        }

        .label {
            font-size: 18px;
            color: #555;
        }

        .distance {
            font-size: 48px;
            font-weight: bold;
            margin-top: 5px;
        }

        .unit {
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            color: #555;
        }

        #accuracy {
            margin-top: 10px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Lyngbygaard</h1>

        <div class="hole">
            Hul 1
        </div>

        <div class="distance-box">
            <div class="label">FRONT</div>
            <div class="distance" id="frontDistance">---</div>
            <div class="unit">meter</div>
        </div>

        <div class="distance-box">
            <div class="label">CENTER</div>
            <div class="distance" id="centerDistance">---</div>
            <div class="unit">meter</div>
        </div>

        <div class="distance-box">
            <div class="label">BAG</div>
            <div class="distance" id="backDistance">---</div>
            <div class="unit">meter</div>
        </div>

        <button id="startButton">
            Start GPS
        </button>

        <div id="status">
            GPS er ikke startet
        </div>

        <div id="accuracy">
        </div>

    </div>


    <script>

        /*
        ------------------------------------------------
        GREEN KOORDINATER
        ------------------------------------------------

        Disse værdier kommer direkte fra dit Excel-ark.

        Husk:
        Excel:      56,17438333
        JavaScript: 56.17438333
        */

        const hole1 = {

            front: {
                lat: 56.17438333,
                lon: 10.03423889
            },

            center: {
                lat: 56.17456389,
                lon: 10.03441111
            },

            back: {
                lat: 56.17469722,
                lon: 10.03463333
            }

        };


        /*
        ------------------------------------------------
        BEREGN AFSTAND MELLEM TO GPS-PUNKTER
        ------------------------------------------------

        Funktionen bruger Haversine-formlen.

        Resultatet returneres i meter.
        */

        function calculateDistance(lat1, lon1, lat2, lon2) {

            const earthRadius = 6371000;

            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;

            const deltaLat =
                (lat2 - lat1) * Math.PI / 180;

            const deltaLon =
                (lon2 - lon1) * Math.PI / 180;


            const a =
                Math.sin(deltaLat / 2) *
                Math.sin(deltaLat / 2) +

                Math.cos(lat1Rad) *
                Math.cos(lat2Rad) *

                Math.sin(deltaLon / 2) *
                Math.sin(deltaLon / 2);


            const c =
                2 * Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            const distance =
                earthRadius * c;


            return distance;
        }


        /*
        ------------------------------------------------
        MODTAG GPS-POSITION
        ------------------------------------------------
        */

        function positionUpdated(position) {

            const myLatitude =
                position.coords.latitude;

            const myLongitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            console.log(
                "Min position:",
                myLatitude,
                myLongitude
            );


            /*
            Beregn afstand til de tre green-punkter
            */

            const distanceFront =
                calculateDistance(
                    myLatitude,
                    myLongitude,
                    hole1.front.lat,
                    hole1.front.lon
                );


            const distanceCenter =
                calculateDistance(
                    myLatitude,
                    myLongitude,
                    hole1.center.lat,
                    hole1.center.lon
                );


            const distanceBack =
                calculateDistance(
                    myLatitude,
                    myLongitude,
                    hole1.back.lat,
                    hole1.back.lon
                );


            /*
            Vis resultat på skærmen
            */

            document.getElementById(
                "frontDistance"
            ).textContent =
                Math.round(distanceFront);


            document.getElementById(
                "centerDistance"
            ).textContent =
                Math.round(distanceCenter);


            document.getElementById(
                "backDistance"
            ).textContent =
                Math.round(distanceBack);


            document.getElementById(
                "status"
            ).textContent =
                "GPS aktiv";


            document.getElementById(
                "accuracy"
            ).textContent =
                "Estimeret GPS-nøjagtighed: ±" +
                Math.round(accuracy) +
                " meter";
        }


        /*
        ------------------------------------------------
        GPS-FEJL
        ------------------------------------------------
        */

        function positionError(error) {

            document.getElementById(
                "status"
            ).textContent =
                "GPS fejl: " + error.message;

        }


        /*
        ------------------------------------------------
        START GPS
        ------------------------------------------------
        */

        function startGPS() {

            if (!navigator.geolocation) {

                document.getElementById(
                    "status"
                ).textContent =
                    "Denne browser understøtter ikke GPS.";

                return;
            }


            document.getElementById(
                "status"
            ).textContent =
                "Finder GPS-position...";


            navigator.geolocation.watchPosition(

                positionUpdated,

                positionError,

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }

            );

        }


        /*
        Start når knappen trykkes
        */

        document.getElementById(
            "startButton"
        ).addEventListener(
            "click",
            startGPS
        );

    </script>

</body>

</html>
