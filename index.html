<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">

        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>Lyngbygaard Golf GPS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            margin: 0;
            padding: 12px;

            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }


        /*
        ------------------------------------------------
        SKÆRME
        ------------------------------------------------
        */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }


        /*
        ------------------------------------------------
        HOVEDMENU
        ------------------------------------------------
        */

        .main-menu {
            padding-top: 35px;
        }

        .main-menu h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .main-menu-subtitle {
            font-size: 17px;
            color: #666;
            margin-bottom: 35px;
        }

        .course-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .course-button {
            width: 100%;

            padding: 22px 18px;

            border: none;
            border-radius: 14px;

            background-color: white;

            text-align: left;

            cursor: pointer;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .course-button:active {
            transform: scale(0.98);
        }

        .course-name {
            display: block;

            font-size: 20px;
            font-weight: bold;

            color: #222;

            margin-bottom: 6px;
        }

        .course-info {
            display: block;

            font-size: 14px;

            color: #666;
        }

        .course-button.available {
            border-left: 6px solid #007710;
        }

        .course-button.coming-soon {
            border-left: 6px solid #aaa;
        }

        .coming-soon-label {
            display: inline-block;

            margin-top: 10px;

            padding: 4px 8px;

            border-radius: 6px;

            background-color: #eeeeee;

            font-size: 12px;
            color: #666;
        }


        /*
        ------------------------------------------------
        HEADER PÅ BANESIDER
        ------------------------------------------------
        */

        .screen-header {
            position: relative;

            min-height: 55px;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }

        .screen-header h1 {
            font-size: 26px;

            margin-top: 12px;
            margin-bottom: 8px;

            padding-left: 50px;
            padding-right: 50px;
        }


        /*
        ------------------------------------------------
        HJEM-KNAP
        ------------------------------------------------
        */

        .home-button {
            position: absolute;

            top: 0;
            left: 0;

            width: 58px;
            height: 58px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 10px;

            background: transparent;

            cursor: pointer;

            color: #007710;
        }

        .home-button svg {
            width: 48px;
            height: 48px;

            display: block;

            fill: currentColor;
        }

        .home-button:active {
            background-color: #e5e5e5;
        }


        /*
        ------------------------------------------------
        HUL-NAVIGATION
        ------------------------------------------------
        */

        .hole-navigation {
            position: relative;

            display: grid;

            min-height: 36px;

            align-items: center;

            margin-bottom: 28px;
        }

        .hole {
            font-size: 24px;
        }

        .hole-nav-button {
            position: absolute;

            top: 60%;

            width: 100px;
            height: 100px;

            padding: 0;

            border: none;
            background: transparent;

            color: #007710;

            font-size: 32px;
            line-height: 1;

            cursor: pointer;

            transform: translateY(-50%);
        }

        #prevHoleButton {
            left: 64px;
        }

        #nextHoleButton {
            right: 64px;
        }

        .hole-nav-button:disabled {
            visibility: hidden;
        }

        .hole-nav-button:active {
            opacity: 0.5;
        }


        /*
        ------------------------------------------------
        GPS KNAP
        ------------------------------------------------
        */

        #startButton {
            width: 100%;

            padding: 14px;

            margin-top: 4px;

            font-size: 16px;

            border: none;
            border-radius: 10px;

            background-color: #e9e9e9;
            color: #007aff;

            cursor: pointer;

            transition:
                background-color 0.2s,
                color 0.2s;
        }

        #startButton.gps-active {
            background-color: #d93636;
            color: white;
        }

        #startButton:active {
            opacity: 0.8;
        }


        /*
        ------------------------------------------------
        GPS STATUS
        ------------------------------------------------
        */

        #status {
            margin-top: 8px;

            font-size: 15px;

            color: #555;
        }

        #accuracy {
            margin-top: 4px;
            margin-bottom: 12px;

            font-size: 13px;

            color: #777;
        }


        /*
        ------------------------------------------------
        HOVEDLAYOUT
        ------------------------------------------------
        */

        .hole-layout {
            display: grid;

            grid-template-columns:
                120px minmax(0, 1fr);

            gap: 10px;

            width: 100%;

            margin-top: 10px;

            align-items: stretch;
        }


        /*
        ------------------------------------------------
        AFSTANDSKOLONNE
        ------------------------------------------------
        */

        .distance-column {
            display: flex;

            flex-direction: column;

            justify-content: space-between;

            gap: 10px;
        }


        /*
        ------------------------------------------------
        AFSTANDSBOKSE
        ------------------------------------------------
        */

        .distance-box {
            background-color: white;

            padding: 12px 4px;

            border-radius: 12px;

            min-height: 100px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }

        .label {
            font-size: 13px;

            color: #555;

            margin-bottom: 8px;
        }

        .distance {
            font-size: 32px;

            font-weight: bold;

            line-height: 1;

            margin: 0;
        }

        .unit {
            font-size: 12px;

            margin-top: 6px;

            color: #555;
        }


        /*
        ------------------------------------------------
        BANEOVERSIGT
        ------------------------------------------------
        */

        .hole-map-container {
            width: 100%;

            margin: 0;

            min-width: 0;
        }

        .hole-map {
            width: 100%;

            height: auto;

            display: block;

            margin: 0;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15);
        }


        /*
        ------------------------------------------------
        18-HULSBANEN - KOMMER SNART
        ------------------------------------------------
        */

        .coming-soon-page {
            background-color: white;

            padding: 30px 20px;

            border-radius: 14px;

            margin-top: 30px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .coming-soon-page h2 {
            margin-top: 0;

            font-size: 24px;
        }

        .coming-soon-page p {
            color: #666;

            line-height: 1.5;
        }


        /*
        ------------------------------------------------
        EKSTRA TIL SMÅ TELEFONER
        ------------------------------------------------
        */

        @media (max-width: 360px) {

            body {
                padding: 8px;
            }

            .hole-layout {

                font-size: 21px;
            }

            .hole {
                font-size: 22px;
            }

            .main-menu h1 {
                font-size: 27px;
            }

        }

        function showScreen(screenId) {

            const screens =

                    ".screen"
                );


            screens.forEach(
                function (screen) {

                    screen.classList.remove(
                        "active"
                    );

                }
            );


            document
                .getElementById(screenId)
                .classList.add(
                    "active"
                );


            window.scrollTo(

            );
        }

        /*
        ================================================================
        BEREGN AFSTAND
        ================================================================
        */

        function calculateDistance(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const earthRadius =
                6371000;


            const lat1Rad =
                lat1 *
                Math.PI /
                180;


            const lat2Rad =
                lat2 *
                Math.PI /
                180;


            const deltaLat =
                (lat2 - lat1) *
                Math.PI /
                180;


            const deltaLon =
                (lon2 - lon1) *
                Math.PI /
                180;


            const a =

                Math.sin(
                    deltaLat / 2
                ) *

                Math.sin(
                    deltaLat / 2
                )

                +

                Math.cos(
                    lat1Rad
                ) *

                Math.cos(
                    lat2Rad
                ) *

                Math.sin(
                    deltaLon / 2
                ) *

                Math.sin(
                    deltaLon / 2
                );


            const c =

                2 *

                Math.atan2(

                    Math.sqrt(a),

                    Math.sqrt(
                        1 - a
                    )

                );


            return (
                earthRadius * c
            );
        }



        /*
        ================================================================
        BEREGN OG VIS AFSTANDE
        ================================================================
        */

        function updateDistances(
            position
        ) {

            const currentHole =
                holes[
                    currentHoleIndex
                ];


            const myLatitude =
                position.coords.latitude;


            const myLongitude =
                position.coords.longitude;


            const distanceFront =
                calculateDistance(

                    myLatitude,
                    myLongitude,

                    currentHole.front.lat,
                    currentHole.front.lon

                );


            const distanceCenter =
                calculateDistance(

                    myLatitude,
                    myLongitude,

                    currentHole.center.lat,
                    currentHole.center.lon

                );


            const distanceBack =
                calculateDistance(

                    myLatitude,
                    myLongitude,

                    currentHole.back.lat,
                    currentHole.back.lon

                );


            document
                .getElementById(
                    "frontDistance"
                )
                .textContent =
                Math.round(
                    distanceFront
                );


            document
                .getElementById(
                    "centerDistance"
                )
                .textContent =
                Math.round(
                    distanceCenter
                );


            document
                .getElementById(
                    "backDistance"
                )
                .textContent =
                Math.round(
                    distanceBack
                );
        }



        /*
        ================================================================
        NY GPS-POSITION
        ================================================================
        */

        function positionUpdated(
            position
        ) {

            latestPosition =
                position;


            console.log(
                "Min position:",
                position.coords.latitude,
                position.coords.longitude
            );


            updateDistances(
                position
            );


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "GPS aktiv";


            document
                .getElementById(
                    "accuracy"
                )
                .textContent =

                "Estimeret GPS-nøjagtighed: ±" +

                Math.round(
                    position.coords.accuracy
                )

                +

                " meter";
        }



        /*
        ================================================================
        GPS-FEJL
        ================================================================
        */

        function positionError(
            error
        ) {

            document
                .getElementById(
                    "status"
                )
                .textContent =

                "GPS fejl: " +

                error.message;
        }



        /*
        ================================================================
        START GPS
        ================================================================
        */

        function startGPS() {

            if (
                !navigator.geolocation
            ) {

                document
                    .getElementById(
                        "status"
                    )
                    .textContent =
                    "Denne browser understøtter ikke GPS.";


                return;
            }


            if (
                watchId !== null
            ) {

                return;
            }


            document
                .getElementById(
                    "status"
                )
                .textContent =
                "Finder GPS-position...";


            watchId =
                navigator
                    .geolocation
                    .watchPosition(

                        positionUpdated,

                        positionError,

                        {
                            enableHighAccuracy:
                                true,

                            timeout:
                                10000,

                            maximumAge:
                                0
                        }

                    );


            const button =
                document.getElementById(
                    "startButton"
                );


            button.textContent =
                "Stop GPS";


            button
                .classList
                .add(
                    "gps-active"
                );


            button.setAttribute(
                "aria-pressed",
                "true"
            );
        }



        /*
        ================================================================
        STOP GPS
        ================================================================
        */

        function stopGPS(
            statusText =
                "GPS stoppet"
        ) {

            if (
                watchId !== null
            ) {

                navigator
                    .geolocation
                    .clearWatch(
                        watchId
                    );


                watchId =
                    null;
            }


            latestPosition =
                null;


            const button =
                document.getElementById(
                    "startButton"
                );


            button.textContent =
                "Start GPS";


            button
                .classList
                .remove(
                    "gps-active"
                );


            button.setAttribute(
                "aria-pressed",
                "false"
            );


            document
                .getElementById(
                    "status"
                )
                .textContent =
                statusText;


            document
                .getElementById(
                    "accuracy"
                )
                .textContent =
                "";


            resetDistances();
        }



        /*
        ================================================================
        NULSTIL AFSTANDE
        ================================================================
        */

        function resetDistances() {

            document
                .getElementById(
                    "frontDistance"
                )
                .textContent =
                "---";


            document
                .getElementById(
                    "centerDistance"
                )
                .textContent =
                "---";


            document
                .getElementById(
                    "backDistance"
                )
                .textContent =
                "---";
        }



        /*
        ================================================================
        OPDATER HUL
        ================================================================
        */

        function updateHoleDisplay() {

            const currentHole =
                holes[
                    currentHoleIndex
                ];


            document
                .getElementById(
                    "holeTitle"
                )
                .textContent =

                "Hul " +

                currentHole.number;


            const holeMap =
                document.getElementById(
                    "holeMap"
                );


            holeMap.src =
                currentHole.image;


            holeMap.alt =
                "Baneoversigt hul " +
                currentHole.number;


            /*
            Skjul tilbage-pilen på hul 1
            */

            document
                .getElementById(
                    "prevHoleButton"
                )
                .disabled =
                currentHoleIndex === 0;


            /*
            Skjul frem-pilen på hul 9
            */

            document
                .getElementById(
                    "nextHoleButton"
                )
                .disabled =

                currentHoleIndex ===
                holes.length - 1;


            /*
            Hvis GPS kører, beregn
            afstande til det nye hul.
            */

            if (
                latestPosition !== null
            ) {

                updateDistances(
                    latestPosition
                );

            } else {

                resetDistances();

            }
        }



        /*
        ================================================================
        EVENT LISTENERS
        ================================================================
        */


        /*
        HOVEDMENU:
        SEGA 9-HULSBANE
        */

        document
            .getElementById(
                "segaCourseButton"
            )
            .addEventListener(
                "click",
                openSegaCourse
            );



        /*
        HOVEDMENU:
        18-HULSBANE
        */

        document
            .getElementById(
                "mainCourseButton"
            )
            .addEventListener(
                "click",
                openMainCourse
            );



        /*
        HJEM FRA SEGA
        */

        document
            .getElementById(
                "segaHomeButton"
            )
            .addEventListener(
                "click",
                goHome
            );



        /*
        HJEM FRA 18-HULSBANEN
        */

        document
            .getElementById(
                "mainCourseHomeButton"
            )
            .addEventListener(
                "click",
                goHome
            );



        /*
        START / STOP GPS
        */

        document
            .getElementById(
                "startButton"
            )
            .addEventListener(
                "click",
                function () {

                    if (
                        watchId === null
                    ) {

                        startGPS();

                    } else {

                        stopGPS();

                    }

                }
            );



        /*
        FORRIGE HUL
        */

        document
            .getElementById(
                "prevHoleButton"
            )
            .addEventListener(
                "click",
                function () {

                    if (
                        currentHoleIndex >
                        0
                    ) {

                        currentHoleIndex--;

                        updateHoleDisplay();

                    }

                }
            );



        /*
        NÆSTE HUL
        */

        document
            .getElementById(
                "nextHoleButton"
            )
            .addEventListener(
                "click",
                function () {

                    if (
                        currentHoleIndex <
                        holes.length - 1
                    ) {

                        currentHoleIndex++;

                        updateHoleDisplay();

                    }

                }
            );



        /*
        ================================================================
        INITIALISERING
        ================================================================
        */

        updateHoleDisplay();

        showScreen(
            "mainMenuScreen"
        );


    </script>

</body>

</html>
