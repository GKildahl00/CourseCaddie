<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

    <title>CourseCaddie</title>

    <link
        rel="manifest"
        href="./manifest.webmanifest"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/apple-touch-icon.png"
    >

    <meta
        name="theme-color"
        content="#f4f4f4"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /*
            Opdateres også fra JavaScript med den faktisk synlige
            Safari-højde. 100dvh fungerer som fallback i moderne browsere.
            */
            --app-height: 100dvh;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 12px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /*
        ------------------------------------------------
        OPSTART / SPLASH SCREEN
        ------------------------------------------------
        */

        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 20000;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding:
                env(safe-area-inset-top)
                24px
                env(safe-area-inset-bottom);

            background-color: #f4f4f4;

            opacity: 1;
            transition: opacity 0.28s ease;
        }

        .splash-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .splash-logo {
            width: clamp(280px, 42vw, 310px);
            height: clamp(280px, 42vw, 310px);

            object-fit: cover;
            border-radius: 28px;
        }

        .splash-title {
            margin-top: 18px;

            font-size: clamp(56px, 8vw, 66px);
            font-weight: 700;
            letter-spacing: -0.8px;

            color: #1c1c1e;
        }

        @media (prefers-reduced-motion: reduce) {
            .splash-screen {
                transition: none;
            }
        }

        /*
        GPS-skærmen fylder præcis den synlige browserhøjde.
        Den indre baneoversigt får resten af pladsen og skaleres.
        */
        #courseScreen.active {
            display: flex;
            flex-direction: column;
            height: calc(var(--app-height, 100dvh) - 24px);
            min-height: 0;
            overflow: hidden;
            padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
        }

        /* ------------------------------------------------
           HOVEDMENU
           ------------------------------------------------ */

        .main-menu {
            padding-top: 35px;
        }

        .main-menu h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .main-menu-subtitle {
            font-size: 17px;
            color: #666;
            margin-bottom: 35px;
        }

        .course-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .course-button {
            width: 100%;
            padding: 22px 18px;

            border: 1px solid #e5e5e7;
            border-radius: 16px;

            background-color: white;

            text-align: left;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .course-button:active {
            transform: scale(0.98);
        }

        .course-name {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-bottom: 6px;
        }

        .course-info {
            display: block;
            font-size: 14px;
            color: #666;
        }

        /* ------------------------------------------------
           HEADER / HJEM
           ------------------------------------------------ */

        .screen-header {
            position: relative;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .screen-header h1 {
            font-size: clamp(21px, 6.6vw, 26px);
            margin-top: clamp(4px, 1.2vh, 12px);
            margin-bottom: clamp(2px, 0.8vh, 8px);
            padding-left: 50px;
            padding-right: 50px;
            line-height: 1.08;
        }

        .home-button {
            position: absolute;

            top: 4px;
            left: 0;

            width: 44px;
            height: 44px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #dedede;
            border-radius: 50%;

            background-color: white;

            cursor: pointer;

            color: #147a36;

            -webkit-tap-highlight-color: transparent;
        }

        .home-button svg {
            width: 23px;
            height: 23px;

            display: block;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .home-button:active {
            transform: scale(0.94);
            background-color: #f0f0f0;
        }

        /* ------------------------------------------------
           HUL-NAVIGATION
           ------------------------------------------------ */

        .hole-navigation {
            position: relative;
            display: grid;
            min-height: 58px;
            align-items: center;
            margin-bottom: clamp(8px, 1.8vh, 20px);
            flex: 0 0 auto;
        }

        .hole {
            font-size: clamp(22px, 6.2vw, 24px);
            position: relative;
            top: 2px;
        }

        .hole-nav-button {
            position: absolute;

            top: 50%;

            width: 58px;
            height: 58px;

            padding: 0;

            border: 1px solid #dedede;
            border-radius: 50%;

            background-color: white;

            color: #147a36;

            font-size: 24px;
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transform: translateY(-50%);

            z-index: 10;

            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #prevHoleButton {
            left: clamp(50px, 16vw, 84px);
        }

        #nextHoleButton {
            right: clamp(50px, 16vw, 84px);
        }

        .hole-nav-button:disabled {
            visibility: hidden;
        }

        .hole-nav-button:active {
            background-color: #f0f0f0;
        }

        /* ------------------------------------------------
           GPS
           ------------------------------------------------ */

        #startButton {
            width: 100%;
            padding: clamp(10px, 1.7vh, 14px);
            margin-top: 2px;
            flex: 0 0 auto;
            font-size: 16px;
            border: 1px solid #dedede;
            border-radius: 12px;
            background-color: white;
            color: #147a36;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        #startButton.gps-active {
            border-color: #d93636;
            background-color: #d93636;
            color: white;
        }

        #startButton:active {
            opacity: 0.8;
        }

        #status {
            margin-top: clamp(4px, 0.9vh, 8px);
            font-size: 15px;
            flex: 0 0 auto;
            color: #555;
        }

        #accuracy {
            margin-top: 2px;
            margin-bottom: clamp(5px, 1vh, 9px);
            font-size: 13px;
            flex: 0 0 auto;
            color: #777;
        }

        /*
        ------------------------------------------------
        WIND
        ------------------------------------------------
        */

        .wind-widget {
            width: 100%;

            margin-bottom: clamp(5px, 0.9vh, 9px);
            padding: 8px 12px;

            display: grid;
            grid-template-columns: 82px minmax(0, 1fr);
            gap: 13px;
            align-items: center;

            flex: 0 0 auto;

            border: 1px solid #e2e2e4;
            border-radius: 14px;

            background-color: white;

            text-align: left;
        }

        /*
        Compass / wind dial
        */

        .wind-dial {
            position: relative;

            width: 78px;
            height: 78px;

            border: 1.5px solid #c8c8cc;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at center,
                    #ffffff 0%,
                    #fafafa 65%,
                    #f1f1f3 100%
                );
        }

        /*
        Subtle inner compass ring
        */
        .wind-dial::after {
            content: "";

            position: absolute;
            inset: 9px;

            border: 1px solid #e1e1e4;
            border-radius: 50%;

            pointer-events: none;
        }

        /*
        Small green marker at the top.
        This indicates the direction the phone is pointing.
        */
        .wind-phone-marker {
            position: absolute;

            top: -4px;
            left: 50%;

            width: 0;
            height: 0;

            z-index: 4;

            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 8px solid #147a36;

            transform: translateX(-50%);
        }

        /*
        N / E / S / W compass ring.
        It rotates opposite the phone heading so the
        letters represent real-world compass directions.
        */
        .wind-cardinal-ring {
            position: absolute;
            inset: 0;

            z-index: 3;

            transform: rotate(0deg);
            transform-origin: center center;

            transition: transform 0.08s linear;

            pointer-events: none;
        }

        /*
        N / E / S / W labels
        */
        .wind-cardinal {
            position: absolute;

            z-index: 3;

            font-size: 9px;
            font-weight: 700;
            line-height: 1;

            color: #7a7a80;

            user-select: none;
            pointer-events: none;
        }

        .wind-cardinal.n {
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .wind-cardinal.e {
            top: 50%;
            right: 5px;
            transform: translateY(-50%);
        }

        .wind-cardinal.s {
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .wind-cardinal.w {
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
        }

        /*
        Rotating wind arrow
        */
        .wind-arrow-rotator {
            position: absolute;
            inset: 0;

            z-index: 2;

            transform: rotate(0deg);
            transform-origin: center center;

            transition: transform 0.08s linear;
        }

        .wind-arrow-rotator svg {
            width: 100%;
            height: 100%;

            display: block;
        }

        .wind-arrow-shaft {
            stroke: #147a36;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .wind-arrow-head {
            fill: #147a36;
        }

        .wind-center-dot {
            position: absolute;

            left: 50%;
            top: 50%;

            z-index: 5;

            width: 9px;
            height: 9px;

            border: 2px solid white;
            border-radius: 50%;

            background-color: #147a36;

            transform: translate(-50%, -50%);
        }

        /*
        Text readout
        */

        .wind-readout {
            min-width: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wind-label {
            margin-bottom: 2px;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;

            color: #777;
        }

        .wind-speed-line {
            display: flex;
            align-items: baseline;
            gap: 5px;

            white-space: nowrap;
        }

        .wind-speed {
            font-size: clamp(26px, 7.2vw, 32px);
            font-weight: 700;
            line-height: 1;

            color: #1c1c1e;
        }

        .wind-unit {
            font-size: 13px;
            font-weight: 500;

            color: #666;
        }

        .wind-from {
            margin-top: 4px;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;

            color: #333;
        }

        .wind-status {
            margin-top: 2px;

            overflow: hidden;

            font-size: 10px;
            line-height: 1.15;

            color: #888;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ------------------------------------------------
           AFSTANDE + BANEOVERSIGT
           ------------------------------------------------ */

        .hole-layout {
            display: grid;
            grid-template-columns: clamp(105px, 31vw, 120px) minmax(0, 1fr);
            gap: clamp(8px, 2.5vw, 10px);
            width: 100%;
            margin-top: clamp(3px, 0.8vh, 10px);
            align-items: stretch;

            /* Fylder resten af den synlige skærm */
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .distance-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(6px, 1.2vh, 10px);
            height: 100%;
            min-height: 0;
        }

        .distance-box {
            background-color: white;
            padding: clamp(6px, 1.4vh, 12px) 4px;
            border-radius: 12px;

            /* De tre bokse deler højden ligeligt */
            flex: 1 1 0;
            min-height: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .label {
            font-size: clamp(11px, 3.3vw, 13px);
            color: #555;
            margin-bottom: clamp(3px, 0.8vh, 8px);
        }

        .distance {
            font-size: clamp(26px, 8.2vw, 32px);
            font-weight: bold;
            line-height: 1;
            margin: 0;
        }

        .unit {
            font-size: clamp(10px, 3vw, 12px);
            margin-top: clamp(3px, 0.6vh, 6px);
            color: #555;
        }

        .hole-map-container {
            width: 100%;
            height: 100%;
            margin: 0;
            min-width: 0;
            min-height: 0;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            background-color: white;
            border-radius: 12px;
            overflow: hidden;

        }

        .hole-map {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;

            display: block;
            margin: 0;

            /*
            Billedet skaleres både efter bredde og højde,
            men bliver aldrig forvrænget.
            */
            object-fit: contain;
            object-position: center top;
        }

        /*
        ------------------------------------------------
        BANEOVERSIGT - FULDSKÆRMSVISNING
        ------------------------------------------------
        */

        .hole-map {
            cursor: zoom-in;
        }


        /*
        Selve full-screen billedviseren
        */
        .image-viewer {
            position: fixed;

            top: 0;
            right: 0;
            bottom: 0;
            left: 0;

            z-index: 9999;

            display: none;

            background-color: #111111;

            overflow: hidden;

            touch-action: none;

            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }


        /*
        Når billedviseren er åben
        */
        .image-viewer.open {
            display: block;
        }


        /*
        Området hvor billedet kan zoomes
        */
        .image-viewer-stage {
            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            touch-action: none;
        }


        /*
        Det store baneoversigtsbillede
        */
        .image-viewer-image {
            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 100%;

            display: block;

            object-fit: contain;

            transform-origin: center center;

            user-select: none;

            -webkit-user-drag: none;

            touch-action: none;

            will-change: transform;
        }


        /*
        Luk-knappen
        */
        .image-viewer-close {
            position: absolute;

            top: calc(12px + env(safe-area-inset-top));
            right: 12px;

            z-index: 10000;

            width: 48px;
            height: 48px;

            border: none;
            border-radius: 50%;

            background-color: rgba(255, 255, 255, 0.9);

            color: #222;

            font-size: 32px;
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }

            #courseScreen.active {
                height: calc(var(--app-height, 100dvh) - 16px);
            }

            .hole-layout {
                grid-template-columns: 100px minmax(0, 1fr);
                gap: 8px;
            }

            .distance {
                font-size: 28px;
            }

            .label {
                font-size: 12px;
            }

            .unit {
                font-size: 11px;
            }

            .screen-header h1 {
                font-size: 21px;
            }

            .hole {
                font-size: 22px;
            }

            .main-menu h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!--
    ================================================================
    COURSE CADDIE SPLASH SCREEN
    ================================================================
    -->

    <div
        id="splashScreen"
        class="splash-screen"
        aria-hidden="false"
    >
        <img
            class="splash-logo"
            src="./icons/loading_screen_pic.png"
            alt="CourseCaddie logo"
        >

        <div class="splash-title">
            CourseCaddie
        </div>
    </div>


    <div class="container">

        <!-- HOVEDMENU -->
        <div id="mainMenuScreen" class="screen active">
            <div class="main-menu">
                <h1>Welcome to CourseCaddie</h1>
                <div class="main-menu-subtitle">Select course</div>

                <div class="course-list">
                    <button id="segaCourseButton" class="course-button" type="button">
                        <span class="course-name">Lyngbygaard SEGA 9-hole course</span>
                        <span class="course-info">
                            <ul>
                                <li>Par: 33</li>
                                <li>Tee 26: 2589 m</li>
                                <li>Tee 24: 2488 m</li>
                                <li>Tee 22: 2281 m</li>
                                <li>Tee 21: 2204 m</li>
                                <li>Tee 19: 1936 m</li>
                            </ul>
                        </span>
                    </button>

                    <button id="mainCourseButton" class="course-button" type="button">
                        <span class="course-name">Lyngbygaard 18-hole course</span>
                        <span class="course-info">
                            <ul>
                                <li>Par: 72</li>
                                <li>Tee 64: 6433 m</li>
                                <li>Tee 62: 6197 m</li>
                                <li>Tee 58: 5835 m</li>
                                <li>Tee 53: 5332 m</li>
                                <li>Tee 47: 4820 m</li>
                            </ul>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- FÆLLES GPS-SKÆRM FOR BEGGE BANER -->
        <div id="courseScreen" class="screen">

            <div class="screen-header">
                <button id="homeButton" class="home-button" type="button" aria-label="Back to main menu">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M3.5 10.5 12 3.5l8.5 7v8.25A1.75 1.75 0 0 1 18.75 20.5H14v-6h-4v6H5.25A1.75 1.75 0 0 1 3.5 18.75Z"
                        />
                    </svg>
                </button>

                <h1 id="courseTitle">Course</h1>
            </div>

            <div class="hole-navigation">
                <button id="prevHoleButton" class="hole-nav-button" type="button" aria-label="Previous hole">
                    ◀
                </button>

                <div class="hole" id="holeTitle">
                    Hole 1
                </div>

                <button id="nextHoleButton" class="hole-nav-button" type="button" aria-label="Next hole">
                    ▶
                </button>
            </div>

            <button id="startButton" type="button" aria-pressed="false">
                Start GPS
            </button>

            <div id="status">
                GPS is not started
            </div>

            <div id="accuracy"></div>

            <div
                id="windWidget"
                class="wind-widget"
                aria-live="polite"
            >
                <div
                    class="wind-dial"
                    aria-hidden="true"
                >
                    <div class="wind-phone-marker"></div>

                    <div
                        id="windCardinalRing"
                        class="wind-cardinal-ring"
                    >
                        <span class="wind-cardinal n">N</span>
                        <span class="wind-cardinal e">E</span>
                        <span class="wind-cardinal s">S</span>
                        <span class="wind-cardinal w">W</span>
                    </div>

                    <div
                        id="windArrowRotator"
                        class="wind-arrow-rotator"
                    >
                        <svg viewBox="0 0 78 78">
                            <line
                                class="wind-arrow-shaft"
                                x1="39"
                                y1="49"
                                x2="39"
                                y2="22"
                            />

                            <path
                                class="wind-arrow-head"
                                d="M39 16 L30 28 L48 28 Z"
                            />
                        </svg>
                    </div>

                    <div class="wind-center-dot"></div>
                </div>


                <div class="wind-readout">

                    <div class="wind-label">
                        WIND
                    </div>

                    <div class="wind-speed-line">

                        <span
                            id="windSpeed"
                            class="wind-speed"
                        >
                            --
                        </span>

                        <span class="wind-unit">
                            m/s
                        </span>

                    </div>

                    <div
                        id="windFrom"
                        class="wind-from"
                    >
                        FROM --°
                    </div>

                    <div
                        id="windStatus"
                        class="wind-status"
                    >
                        Start GPS for wind
                    </div>

                </div>
            </div>

            <div class="hole-layout">
                <div class="distance-column">

                    <div class="distance-box">
                        <div class="label">BACK</div>
                        <div class="distance" id="backDistance">---</div>
                        <div class="unit">meters</div>
                    </div>

                    <div class="distance-box">
                        <div class="label">CENTER</div>
                        <div class="distance" id="centerDistance">---</div>
                        <div class="unit">meters</div>
                    </div>

                    <div class="distance-box">
                        <div class="label">FRONT</div>
                        <div class="distance" id="frontDistance">---</div>
                        <div class="unit">meters</div>
                    </div>

                </div>

                <div class="hole-map-container">
                    <img
                        id="holeMap"
                        src="images/Lyngbygaard_9_hulsbanen_hul_1.png"
                        alt="Course overview - Hole 1"
                        class="hole-map"
                    >
                </div>
            </div>
        </div>
    </div>

    <!--
    ================================================================
    FULDSKÆRMS BANEOVERSIGT
    ================================================================
    -->

    <div
        id="imageViewer"
        class="image-viewer"
        aria-hidden="true"
    >

        <button
            id="imageViewerClose"
            class="image-viewer-close"
            type="button"
            aria-label="Close course overview"
        >
            ×
        </button>


        <div
            id="imageViewerStage"
            class="image-viewer-stage"
        >

            <img
                id="imageViewerImage"
                class="image-viewer-image"
                src=""
                alt="Enlarged course overview"
                draggable="false"
            >

        </div>

    </div>

    <script>
        /*
        ================================================================
        COURSE CADDIE SPLASH SCREEN
        ================================================================
        */

        const splashScreen =
            document.getElementById(
                "splashScreen"
            );


        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        splashScreen.classList.add(
                            "hide"
                        );


                        setTimeout(
                            function () {

                                splashScreen.style.display =
                                    "none";

                                splashScreen.setAttribute(
                                    "aria-hidden",
                                    "true"
                                );

                            },

        /*
        ================================================================
        SYNLIG SAFARI-HØJDE
        ================================================================

        Safari på iPhone ændrer den synlige højde, når adresse- og
        værktøjslinjen vises/skjules. visualViewport giver os den
        aktuelle højde, så layoutet altid kan tilpasse sig.
        */

        function updateVisibleHeight(forceUpdate = false) {

            const viewport = window.visualViewport;

            /*
            Hvis brugeren pinch-zoomer, må layoutet IKKE
            beregne sin størrelse igen.
            */
            if (
                viewport &&
                !forceUpdate &&
                Math.abs(viewport.scale - 1) > 0.01
            ) {
                return;
            }

            const visibleHeight =
                viewport
                    ? viewport.height
                    : window.innerHeight;

            document.documentElement.style.setProperty(
                "--app-height",
                visibleHeight + "px"
            );
        }


        /*
        Første indlæsning
        */
        updateVisibleHeight(true);


        /*
        Normal ændring af vinduets størrelse
        */
        window.addEventListener(
            "resize",
            function () {
                updateVisibleHeight(false);
            }
        );


        /*
        Telefonen drejes
        */
        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    function () {
                        updateVisibleHeight(true);
                    },
                    150
                );

            }
        );


        /*
        Safari viser/skjuler sine bjælker.
        Men pinch-zoom ignoreres.
        */
        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                function () {
                    updateVisibleHeight(false);
                }
            );

        }

        /*
        ================================================================
        AFSTANDSBEREGNING
        ================================================================
        */

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const earthRadius = 6371000;

            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const deltaLat = (lat2 - lat1) * Math.PI / 180;
            const deltaLon = (lon2 - lon1) * Math.PI / 180;

            const a =
                Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
                Math.cos(lat1Rad) * Math.cos(lat2Rad) *
                Math.sin(deltaLon / 2) * Math.sin(deltaLon / 2);

            const c =
                2 * Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );

            return earthRadius * c;
        }

        function updateDistances(position) {
            if (currentCourseKey === null) {
                return;
            }

            const currentHole = getCurrentHole();

            const myLatitude = position.coords.latitude;
            const myLongitude = position.coords.longitude;

            const distanceFront = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.front.lat,
                currentHole.front.lon
            );

            const distanceCenter = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.center.lat,
                currentHole.center.lon
            );

            const distanceBack = calculateDistance(
                myLatitude,
                myLongitude,
                currentHole.back.lat,
                currentHole.back.lon
            );

            document.getElementById("frontDistance").textContent =
                Math.round(distanceFront);

            document.getElementById("centerDistance").textContent =
                Math.round(distanceCenter);

            document.getElementById("backDistance").textContent =
                Math.round(distanceBack);
        }

        /*
        ================================================================
        WIND + COMPASS
        ================================================================

        Wind data comes from Open-Meteo at the current GPS position.
        The weather API reports the direction the wind COMES FROM.

        Relative direction:
        0°   = wind comes from straight ahead
        90°  = wind comes from the right
        180° = wind comes from behind
        270° = wind comes from the left
        */

        const windSpeedElement =
            document.getElementById(
                "windSpeed"
            );


        const windFromElement =
            document.getElementById(
                "windFrom"
            );


        const windStatusElement =
            document.getElementById(
                "windStatus"
            );


        const windArrowRotator =
            document.getElementById(
                "windArrowRotator"
            );


        const windCardinalRing =
            document.getElementById(
                "windCardinalRing"
            );


        let windSpeedMs = null;
        let windDirectionFrom = null;

        let phoneHeading = null;
        let smoothedPhoneHeading = null;

        let compassAccuracy = null;
        let compassListening = false;

        let lastRelativeWind = null;
        let continuousArrowRotation = 0;

        let lastWindFetchTime = 0;
        let windFetchInProgress = false;

        let windSessionId = 0;

        const WIND_UPDATE_INTERVAL_MS =
            2 * 60 * 1000;


        /*
        ------------------------------------------------
        ANGLE HELPERS
        ------------------------------------------------
        */

        function normalizeDegrees(degrees) {

            return (
                (degrees % 360) +
                360
            ) % 360;
        }


        function shortestAngleDelta(
            fromDegrees,
            toDegrees
        ) {

            return (
                (
                    toDegrees -
                    fromDegrees +
                    540
                ) %
                360
            ) - 180;
        }


        /*
        ------------------------------------------------
        UPDATE WIND UI
        ------------------------------------------------
        */

        function updateWindDisplay() {

            if (
                windSpeedMs === null ||
                windDirectionFrom === null
            ) {

                windSpeedElement.textContent =
                    "--";

                windFromElement.textContent =
                    "FROM --°";

                windArrowRotator.style.transform =
                    "rotate(0deg)";

                return;
            }


            windSpeedElement.textContent =
                windSpeedMs.toFixed(1);


            /*
            Weather data is available, but the compass
            has not produced a usable heading yet.
            */

            if (
                phoneHeading === null
            ) {

                windFromElement.textContent =
                    "FROM --°";

                windArrowRotator.style.transform =
                    "rotate(0deg)";

                return;
            }


            const relativeWindFrom =
                normalizeDegrees(
                    windDirectionFrom -
                    phoneHeading
                );


            /*
            Keep rotation continuous around 0/360 so the
            arrow does not make a full turn when crossing north.
            */

            if (
                lastRelativeWind === null
            ) {

                continuousArrowRotation =
                    relativeWindFrom;

            } else {

                continuousArrowRotation +=
                    shortestAngleDelta(
                        lastRelativeWind,
                        relativeWindFrom
                    );
            }


            lastRelativeWind =
                relativeWindFrom;


            windArrowRotator.style.transform =
                "rotate(" +
                continuousArrowRotation +
                "deg)";


            windFromElement.textContent =
                "FROM " +
                String(
                    Math.round(
                        relativeWindFrom
                    )
                ).padStart(
                    3,
                    "0"
                ) +
                "°";


            if (
                compassAccuracy !== null &&
                compassAccuracy >= 0 &&
                compassAccuracy > 25
            ) {

                windStatusElement.textContent =
                    "Compass accuracy ±" +
                    Math.round(
                        compassAccuracy
                    ) +
                    "°";

            } else {

                windStatusElement.textContent =
                    "Relative to phone direction";
            }
        }


        /*
        ------------------------------------------------
        COMPASS
        ------------------------------------------------
        */

        function deviceOrientationUpdated(
            event
        ) {

            let newHeading = null;


            /*
            iPhone / Safari:
            webkitCompassHeading gives a real compass heading.
            */

            if (
                typeof event.webkitCompassHeading ===
                    "number" &&
                event.webkitCompassHeading >= 0
            ) {

                newHeading =
                    event.webkitCompassHeading;


                if (
                    typeof event.webkitCompassAccuracy ===
                        "number"
                ) {

                    compassAccuracy =
                        event.webkitCompassAccuracy;
                }

            } else if (
                event.absolute === true &&
                typeof event.alpha === "number"
            ) {

                /*
                Fallback for browsers that provide an
                absolute alpha angle.
                */

                newHeading =
                    normalizeDegrees(
                        360 -
                        event.alpha
                    );
            }


            if (
                newHeading === null
            ) {

                return;
            }


            /*
            Light circular smoothing to make the arrow
            calmer without making it feel sluggish.
            */

            if (
                smoothedPhoneHeading === null
            ) {

                smoothedPhoneHeading =
                    newHeading;

            } else {

                smoothedPhoneHeading =
                    normalizeDegrees(
                        smoothedPhoneHeading +
                        shortestAngleDelta(
                            smoothedPhoneHeading,
                            newHeading
                        ) *
                        0.22
                    );
            }


            phoneHeading =
                smoothedPhoneHeading;


            /*
            Rotate the compass ring so N/E/S/W remain
            correct relative to the real world while the
            top of the screen remains the phone's forward
            direction.
            */
            windCardinalRing.style.transform =
                "rotate(" +
                (-phoneHeading) +
                "deg)";


            updateWindDisplay();
        }


        async function startCompass(
            sessionId
        ) {

            windStatusElement.textContent =
                "Starting compass...";


            if (
                typeof DeviceOrientationEvent ===
                "undefined"
            ) {

                windStatusElement.textContent =
                    "Compass not supported";

                return;
            }


            try {

                /*
                iPhone may require permission. Because this
                function is called directly by the Start GPS
                button, the system prompt can appear from the
                same user action.
                */

                if (
                    typeof DeviceOrientationEvent
                        .requestPermission ===
                    "function"
                ) {

                    const permission =
                        await DeviceOrientationEvent
                            .requestPermission();


                    if (
                        sessionId !==
                        windSessionId
                    ) {

                        return;
                    }


                    if (
                        permission !==
                        "granted"
                    ) {

                        windStatusElement.textContent =
                            "Compass permission denied";

                        return;
                    }
                }


                if (
                    sessionId !==
                    windSessionId
                ) {

                    return;
                }


                if (
                    !compassListening
                ) {

                    window.addEventListener(
                        "deviceorientation",
                        deviceOrientationUpdated,
                        true
                    );

                    compassListening = true;
                }


                windStatusElement.textContent =
                    "Move phone to read compass";

            } catch (error) {

                console.error(
                    "Compass error:",
                    error
                );


                if (
                    sessionId ===
                    windSessionId
                ) {

                    windStatusElement.textContent =
                        "Compass unavailable";
                }
            }
        }


        function stopCompass() {

            if (
                compassListening
            ) {

                window.removeEventListener(
                    "deviceorientation",
                    deviceOrientationUpdated,
                    true
                );

                compassListening = false;
            }


            phoneHeading = null;
            smoothedPhoneHeading = null;

            compassAccuracy = null;

            lastRelativeWind = null;
            continuousArrowRotation = 0;
        }


        /*
        ------------------------------------------------
        WEATHER DATA
        ------------------------------------------------
        */

        async function updateWindFromWeather(
            position,
            sessionId
        ) {

            if (
                windFetchInProgress
            ) {

                return;
            }


            const now =
                Date.now();


            if (
                lastWindFetchTime !== 0 &&
                now -
                lastWindFetchTime <
                WIND_UPDATE_INTERVAL_MS
            ) {

                return;
            }


            windFetchInProgress = true;

            windStatusElement.textContent =
                "Loading wind...";


            try {

                const latitude =
                    position.coords.latitude;


                const longitude =
                    position.coords.longitude;


                const url =
                    new URL(
                        "https://api.open-meteo.com/v1/forecast"
                    );


                url.searchParams.set(
                    "latitude",
                    latitude.toFixed(6)
                );


                url.searchParams.set(
                    "longitude",
                    longitude.toFixed(6)
                );


                url.searchParams.set(
                    "current",
                    "wind_speed_10m,wind_direction_10m"
                );


                url.searchParams.set(
                    "wind_speed_unit",
                    "ms"
                );


                url.searchParams.set(
                    "timezone",
                    "auto"
                );


                const response =
                    await fetch(
                        url.toString(),
                        {
                            cache: "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Weather request failed"
                    );
                }


                const data =
                    await response.json();


                if (
                    sessionId !==
                    windSessionId ||
                    watchId === null
                ) {

                    return;
                }


                if (
                    !data.current ||
                    typeof data.current
                        .wind_speed_10m !==
                        "number" ||
                    typeof data.current
                        .wind_direction_10m !==
                        "number"
                ) {

                    throw new Error(
                        "Invalid wind data"
                    );
                }


                windSpeedMs =
                    data.current
                        .wind_speed_10m;


                windDirectionFrom =
                    normalizeDegrees(
                        data.current
                            .wind_direction_10m
                    );


                lastWindFetchTime =
                    Date.now();


                updateWindDisplay();


                if (
                    phoneHeading === null
                ) {

                    windStatusElement.textContent =
                        "Move phone to read compass";
                }

            } catch (error) {

                console.error(
                    "Wind data error:",
                    error
                );


                if (
                    sessionId ===
                    windSessionId &&
                    watchId !== null
                ) {

                    windStatusElement.textContent =
                        "Wind data unavailable";
                }

            } finally {

                windFetchInProgress = false;
            }
        }


        function maybeUpdateWind(
            position
        ) {

            if (
                watchId === null
            ) {

                return;
            }


            updateWindFromWeather(
                position,
                windSessionId
            );
        }


        function resetWindDisplay() {

            windSpeedMs = null;
            windDirectionFrom = null;

            lastWindFetchTime = 0;
            windFetchInProgress = false;

            lastRelativeWind = null;
            continuousArrowRotation = 0;

            windSpeedElement.textContent =
                "--";

            windFromElement.textContent =
                "FROM --°";

            windStatusElement.textContent =
                "Start GPS for wind";

            windArrowRotator.style.transform =
                "rotate(0deg)";


            windCardinalRing.style.transform =
                "rotate(0deg)";
        }


        /*
        ================================================================
        GPS
        ================================================================
        */

        function positionUpdated(position) {
            latestPosition = position;

            console.log(
                "Min position:",
                position.coords.latitude,
                position.coords.longitude
            );

            updateDistances(position);

            /*
            Wind data follows the GPS position.
            The request is internally limited to once every
            2 minutes while GPS is active.
            */
            maybeUpdateWind(position);

            document.getElementById("status").textContent =
                "GPS active";

            document.getElementById("accuracy").textContent =
                "Estimated GPS accuracy: ±" +
                Math.round(position.coords.accuracy) +
                " meters";
        }

        function positionError(error) {
            document.getElementById("status").textContent =
                "GPS error: " + error.message;
        }

        function startGPS() {
            if (!navigator.geolocation) {
                document.getElementById("status").textContent =
                    "This browser does not support GPS.";
                return;
            }

            if (watchId !== null) {
                return;
            }

            document.getElementById("status").textContent =
                "Finding GPS position...";

            /*
            Create a new wind/compass session.
            */
            windSessionId++;


            watchId = navigator.geolocation.watchPosition(
                positionUpdated,
                positionError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );


            /*
            Start compass from the same button press.
            On iPhone this may show the motion/orientation
            permission dialog the first time.
            */
            startCompass(
                windSessionId
            );


            const button = document.getElementById("startButton");

            button.textContent = "Stop GPS";
            button.classList.add("gps-active");
            button.setAttribute("aria-pressed", "true");
        }

        function stopGPS(statusText = "GPS stopped") {

            /*
            Invalidate any pending weather/compass work.
            */
            windSessionId++;


            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }


            stopCompass();
            resetWindDisplay();


            latestPosition = null;

            const button = document.getElementById("startButton");

            button.textContent = "Start GPS";
            button.classList.remove("gps-active");
            button.setAttribute("aria-pressed", "false");

            document.getElementById("status").textContent = statusText;
            document.getElementById("accuracy").textContent = "";

            resetDistances();
        }

        function resetDistances() {
            document.getElementById("frontDistance").textContent = "---";
            document.getElementById("centerDistance").textContent = "---";
            document.getElementById("backDistance").textContent = "---";
        }

        /*
        ================================================================
        VISNING AF BANE / HUL
        ================================================================
        */

        function updateCourseDisplay() {
            const currentCourse = getCurrentCourse();

            document.getElementById("courseTitle").textContent =
                currentCourse.name;
        }

        function updateHoleDisplay() {
            if (currentCourseKey === null) {
                return;
            }

            const currentCourse = getCurrentCourse();
            const currentHole = getCurrentHole();

            document.getElementById("holeTitle").textContent =
                "Hole " + currentHole.number;

            const holeMap = document.getElementById("holeMap");

            holeMap.src = currentHole.image;
            holeMap.alt =
                "Course overview - Hole " +
                currentHole.number +
                " - " +
                currentCourse.name;

            document.getElementById("prevHoleButton").disabled =
                currentHoleIndex === 0;

            document.getElementById("nextHoleButton").disabled =
                currentHoleIndex === currentCourse.holes.length - 1;

            if (latestPosition !== null) {
                updateDistances(latestPosition);
            } else {
                resetDistances();
            }
        }

                /*
        ================================================================
        COURSE OVERVIEW - FULLSCREEN ZOOM
        ================================================================
        */

        const imageViewer =
            document.getElementById(
                "imageViewer"
            );


        const imageViewerStage =
            document.getElementById(
                "imageViewerStage"
            );


        const imageViewerImage =
            document.getElementById(
                "imageViewerImage"
            );


        const imageViewerClose =
            document.getElementById(
                "imageViewerClose"
            );


        const holeMap =
            document.getElementById(
                "holeMap"
            );


        /*
        Zoom state
        */

        let viewerScale = 1;

        let viewerTranslateX = 0;
        let viewerTranslateY = 0;

        const viewerMinScale = 1;
        const viewerMaxScale = 5;


        /*
        Active touch pointers
        */

        const activePointers =
            new Map();


        let previousPinchDistance = null;
        let previousPinchCenter = null;

        let previousPanPoint = null;


        /*
        ------------------------------------------------
        POINTER HELPERS
        ------------------------------------------------
        */

        function getPointerDistance(
            pointer1,
            pointer2
        ) {

            return Math.hypot(
                pointer2.x - pointer1.x,
                pointer2.y - pointer1.y
            );
        }


        function getPointerCenter(
            pointer1,
            pointer2
        ) {

            return {
                x:
                    (
                        pointer1.x +
                        pointer2.x
                    ) / 2,

                y:
                    (
                        pointer1.y +
                        pointer2.y
                    ) / 2
            };
        }


        /*
        ------------------------------------------------
        KEEP THE IMAGE INSIDE USEFUL BOUNDS
        ------------------------------------------------
        */

        function clampViewerTranslation() {

            const stageRect =
                imageViewerStage
                    .getBoundingClientRect();


            const baseWidth =
                imageViewerImage.clientWidth;


            const baseHeight =
                imageViewerImage.clientHeight;


            if (
                baseWidth === 0 ||
                baseHeight === 0
            ) {

                return;
            }


            const scaledWidth =
                baseWidth *
                viewerScale;


            const scaledHeight =
                baseHeight *
                viewerScale;


            const maxTranslateX =
                Math.max(
                    0,
                    (
                        scaledWidth -
                        stageRect.width
                    ) / 2
                );


            const maxTranslateY =
                Math.max(
                    0,
                    (
                        scaledHeight -
                        stageRect.height
                    ) / 2
                );


            viewerTranslateX =
                Math.max(
                    -maxTranslateX,
                    Math.min(
                        maxTranslateX,
                        viewerTranslateX
                    )
                );


            viewerTranslateY =
                Math.max(
                    -maxTranslateY,
                    Math.min(
                        maxTranslateY,
                        viewerTranslateY
                    )
                );
        }


        /*
        ------------------------------------------------
        APPLY IMAGE TRANSFORM
        ------------------------------------------------
        */

        function updateViewerTransform() {

            clampViewerTranslation();


            imageViewerImage.style.transform =
                "translate(" +
                viewerTranslateX +
                "px, " +
                viewerTranslateY +
                "px) scale(" +
                viewerScale +
                ")";
        }


        /*
        ------------------------------------------------
        RESET ZOOM
        ------------------------------------------------
        */

        function resetImageViewer() {

            viewerScale = 1;

            viewerTranslateX = 0;
            viewerTranslateY = 0;

            previousPinchDistance = null;
            previousPinchCenter = null;

            previousPanPoint = null;

            activePointers.clear();

            updateViewerTransform();
        }


        /*
        ------------------------------------------------
        OPEN COURSE OVERVIEW
        ------------------------------------------------
        */

        function openImageViewer() {

            imageViewerImage.src =
                holeMap.src;


            imageViewerImage.alt =
                holeMap.alt;


            imageViewer.classList.add(
                "open"
            );


            imageViewer.setAttribute(
                "aria-hidden",
                "false"
            );


            /*
            Wait one frame so the image has its
            correct fullscreen dimensions.
            */

            requestAnimationFrame(
                function () {
                    resetImageViewer();
                }
            );
        }


        /*
        ------------------------------------------------
        CLOSE COURSE OVERVIEW
        ------------------------------------------------
        */

        function closeImageViewer() {

            imageViewer.classList.remove(
                "open"
            );


            imageViewer.setAttribute(
                "aria-hidden",
                "true"
            );


            resetImageViewer();
        }


        /*
        ------------------------------------------------
        POINTER DOWN
        ------------------------------------------------
        */

        imageViewerStage.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();


                imageViewerStage.setPointerCapture(
                    event.pointerId
                );


                activePointers.set(
                    event.pointerId,
                    {
                        x: event.clientX,
                        y: event.clientY
                    }
                );


                if (
                    activePointers.size === 1
                ) {

                    previousPanPoint = {
                        x: event.clientX,
                        y: event.clientY
                    };
                }


                if (
                    activePointers.size === 2
                ) {

                    const pointers =
                        Array.from(
                            activePointers.values()
                        );


                    previousPinchDistance =
                        getPointerDistance(
                            pointers[0],
                            pointers[1]
                        );


                    previousPinchCenter =
                        getPointerCenter(
                            pointers[0],
                            pointers[1]
                        );


                    previousPanPoint = null;
                }
            }
        );


        /*
        ------------------------------------------------
        POINTER MOVE
        ------------------------------------------------
        */

        imageViewerStage.addEventListener(
            "pointermove",
            function (event) {

                if (
                    !activePointers.has(
                        event.pointerId
                    )
                ) {

                    return;
                }


                event.preventDefault();


                activePointers.set(
                    event.pointerId,
                    {
                        x: event.clientX,
                        y: event.clientY
                    }
                );


                /*
                TWO FINGERS:
                PINCH AROUND THE ACTUAL PINCH MIDPOINT.
                */

                if (
                    activePointers.size === 2
                ) {

                    const pointers =
                        Array.from(
                            activePointers.values()
                        );


                    const currentDistance =
                        getPointerDistance(
                            pointers[0],
                            pointers[1]
                        );


                    const currentPinchCenter =
                        getPointerCenter(
                            pointers[0],
                            pointers[1]
                        );


                    if (
                        previousPinchDistance !== null &&
                        previousPinchCenter !== null
                    ) {

                        const oldScale =
                            viewerScale;


                        let newScale =
                            oldScale *
                            (
                                currentDistance /
                                previousPinchDistance
                            );


                        newScale =
                            Math.min(
                                viewerMaxScale,
                                Math.max(
                                    viewerMinScale,
                                    newScale
                                )
                            );


                        const stageRect =
                            imageViewerStage
                                .getBoundingClientRect();


                        const stageCenterX =
                            stageRect.left +
                            stageRect.width / 2;


                        const stageCenterY =
                            stageRect.top +
                            stageRect.height / 2;


                        /*
                        Convert the PREVIOUS pinch midpoint to
                        coordinates relative to the stage center.
                        */

                        const previousCenterX =
                            previousPinchCenter.x -
                            stageCenterX;


                        const previousCenterY =
                            previousPinchCenter.y -
                            stageCenterY;


                        const currentCenterX =
                            currentPinchCenter.x -
                            stageCenterX;


                        const currentCenterY =
                            currentPinchCenter.y -
                            stageCenterY;


                        /*
                        Find the exact point in the unscaled image
                        that was under the fingers before this move.
                        */

                        const imagePointX =
                            (
                                previousCenterX -
                                viewerTranslateX
                            ) /
                            oldScale;


                        const imagePointY =
                            (
                                previousCenterY -
                                viewerTranslateY
                            ) /
                            oldScale;


                        /*
                        Move the image so that the SAME image point
                        stays underneath the CURRENT pinch midpoint.
                        */

                        viewerTranslateX =
                            currentCenterX -
                            newScale *
                            imagePointX;


                        viewerTranslateY =
                            currentCenterY -
                            newScale *
                            imagePointY;


                        viewerScale =
                            newScale;


                        if (
                            viewerScale <=
                            viewerMinScale + 0.001
                        ) {

                            viewerScale =
                                viewerMinScale;

                            viewerTranslateX = 0;
                            viewerTranslateY = 0;
                        }


                        updateViewerTransform();
                    }


                    previousPinchDistance =
                        currentDistance;


                    previousPinchCenter =
                        currentPinchCenter;


                    return;
                }


                /*
                ONE FINGER:
                PAN THE ZOOMED IMAGE.
                */

                if (
                    activePointers.size === 1 &&
                    viewerScale > 1
                ) {

                    const currentPanPoint = {
                        x: event.clientX,
                        y: event.clientY
                    };


                    if (
                        previousPanPoint !== null
                    ) {

                        viewerTranslateX +=
                            currentPanPoint.x -
                            previousPanPoint.x;


                        viewerTranslateY +=
                            currentPanPoint.y -
                            previousPanPoint.y;


                        updateViewerTransform();
                    }


                    previousPanPoint =
                        currentPanPoint;
                }
            }
        );


        /*
        ------------------------------------------------
        POINTER RELEASE
        ------------------------------------------------
        */

        function removeViewerPointer(
            event
        ) {

            activePointers.delete(
                event.pointerId
            );


            previousPinchDistance = null;
            previousPinchCenter = null;


            if (
                activePointers.size === 1
            ) {

                const remainingPointer =
                    Array.from(
                        activePointers.values()
                    )[0];


                previousPanPoint = {
                    x: remainingPointer.x,
                    y: remainingPointer.y
                };

            } else {

                previousPanPoint = null;
            }
        }


        imageViewerStage.addEventListener(
            "pointerup",
            removeViewerPointer
        );


        imageViewerStage.addEventListener(
            "pointercancel",
            removeViewerPointer
        );


        /*
        ------------------------------------------------
        OPEN / CLOSE
        ------------------------------------------------
        */

        holeMap.addEventListener(
            "click",
            openImageViewer
        );


        imageViewerClose.addEventListener(
            "click",
            closeImageViewer
        );


        /*
        Escape on desktop
        */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    imageViewer.classList.contains(
                        "open"
                    )
                ) {

                    closeImageViewer();
                }
            }
        );


/*
                ================================================================
        EVENT LISTENERS
        ================================================================
        */

        document.getElementById("segaCourseButton").addEventListener(
            "click",
            function () {
                openCourse("sega");
            }
        );

        document.getElementById("mainCourseButton").addEventListener(
            "click",
            function () {
                openCourse("main18");
            }
        );

        document.getElementById("homeButton").addEventListener(
            "click",
            goHome
        );

        document.getElementById("startButton").addEventListener(
            "click",
            function () {
                if (watchId === null) {
                    startGPS();
                } else {
                    stopGPS();
                }
            }
        );

        document.getElementById("prevHoleButton").addEventListener(
            "click",
            function () {
                if (currentHoleIndex > 0) {
                    currentHoleIndex--;
                    updateHoleDisplay();
                }
            }
        );

        document.getElementById("nextHoleButton").addEventListener(
            "click",
            function () {
                const currentCourse = getCurrentCourse();

                if (currentHoleIndex < currentCourse.holes.length - 1) {
                    currentHoleIndex++;
                    updateHoleDisplay();
                }
            }
        );

        /*
        ================================================================
        INITIALISERING
        ================================================================
        */

        showScreen("mainMenuScreen");
    </script>
</body>

</html>
